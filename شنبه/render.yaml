services:
  - type: web
    name: hadad-kala-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DEPLOY_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: CARD_NUMBER
        sync: false
      - key: ACCOUNT_HOLDER
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
